spring.application.name=space-booking-backend
server.port=8080

# Embedded file-based H2 database (persists across restarts, no setup needed).
spring.datasource.url=jdbc:h2:file:./data/spacebooking;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Origins allowed to call the API (Angular dev server).
app.cors.allowed-origins=http://localhost:4200

# Authentication. Override the secret (>= 32 chars) and the seeded super admin in real deployments.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
# Access tokens last 1 day; refresh tokens last 7 days and can be used once.
app.jwt.access-token-minutes=1440
app.jwt.refresh-token-days=7
# Created on startup when no super admin exists yet.
app.bootstrap.super-admin.username=${APP_SUPER_ADMIN_USERNAME:superadmin}
app.bootstrap.super-admin.email=${APP_SUPER_ADMIN_EMAIL:superadmin@spacebooking.local}
app.bootstrap.super-admin.password=${APP_SUPER_ADMIN_PASSWORD:ChangeMe@123}
